[build]
  publish = "."
  # the site itself has no build step; this only adds the search index (pagefind/)
  command = "python -m pip install -q -r requirements.txt && python tools/build_search.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# volumes are rebuilt in place; revalidate so readers never see a stale edition
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
